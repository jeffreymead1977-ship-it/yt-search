[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tank-segmentation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pye57>=0.4.10",
    "open3d>=0.18.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
