[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tank-inspector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pye57>=0.4.10",
    "open3d>=0.18.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "PySide6>=6.7",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4",
]

[project.scripts]
tank-inspector = "main:main"
