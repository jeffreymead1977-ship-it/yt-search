<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API 653 Tank Inspector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 14px 24px; background: #1a1d27; border-bottom: 1px solid #2d3040; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.1rem; font-weight: 600; color: #fff; }
    header span { font-size: 0.75rem; color: #888; background: #2d3040; padding: 2px 8px; border-radius: 10px; }
    main { flex: 1; display: grid; grid-template-columns: 320px 1fr; overflow: hidden; }

    /* Sidebar */
    aside { background: #13151f; border-right: 1px solid #2d3040; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .upload-zone { border: 2px dashed #3d4060; border-radius: 10px; padding: 32px 16px; text-align: center; cursor: pointer; transition: border-color .2s; }
    .upload-zone:hover, .upload-zone.drag-over { border-color: #5b6aff; background: rgba(91,106,255,.05); }
    .upload-zone input { display: none; }
    .upload-zone .icon { font-size: 2rem; margin-bottom: 8px; }
    .upload-zone p { font-size: 0.85rem; color: #888; }
    .upload-zone p strong { color: #ccc; }
    .btn { background: #5b6aff; color: #fff; border: none; border-radius: 6px; padding: 10px 18px; font-size: 0.9rem; cursor: pointer; width: 100%; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn:hover:not(:disabled) { background: #6e7bff; }

    /* Status */
    #status-panel { background: #1a1d27; border-radius: 8px; padding: 14px; font-size: 0.82rem; }
    #status-panel h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .06em; color: #666; margin-bottom: 8px; }
    .status-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .status-row span:last-child { color: #aaa; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
    .badge-queued  { background: #2d3040; color: #aaa; }
    .badge-processing { background: #4a3800; color: #ffc; }
    .badge-done    { background: #1a3a1a; color: #6f6; }
    .badge-error   { background: #3a1a1a; color: #f66; }

    /* Legend */
    .legend { display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }

    /* 3D Viewer */
    #viewer { position: relative; flex: 1; }
    canvas { width: 100% !important; height: 100% !important; display: block; }
    #viewer-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: #444; pointer-events: none; }
    #viewer-placeholder .big { font-size: 3rem; }

    #download-btn { display: none; }
  </style>
</head>
<body>
<header>
  <h1>API 653 Tank Inspector</h1>
  <span>Point Cloud Segmentation</span>
</header>
<main>
  <aside>
    <div class="upload-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".e57" />
      <div class="icon">📡</div>
      <p><strong>Drop an E57 file here</strong></p>
      <p>or click to browse</p>
    </div>

    <button class="btn" id="upload-btn" disabled>Upload & Segment</button>
    <button class="btn" id="download-btn" style="background:#2a5a2a">Download Labeled PLY</button>

    <div id="status-panel">
      <h3>Status</h3>
      <div id="status-rows"><div class="status-row"><span>No file loaded</span></div></div>
    </div>

    <div>
      <div id="status-panel" style="margin-bottom:8px">
        <h3>Label Legend</h3>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="swatch" style="background:#e63232"></div> Shell</div>
        <div class="legend-item"><div class="swatch" style="background:#e6cc1a"></div> Floor</div>
        <div class="legend-item"><div class="swatch" style="background:#3366e6"></div> Roof</div>
        <div class="legend-item"><div class="swatch" style="background:#33cc52"></div> Deadwood</div>
        <div class="legend-item"><div class="swatch" style="background:#808080"></div> Rubbish / Noise</div>
      </div>
    </div>
  </aside>

  <div id="viewer">
    <div id="viewer-placeholder">
      <div class="big">🛢️</div>
      <div>Upload an E57 scan to begin</div>
    </div>
  </div>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module" src="viewer.js"></script>
</body>
</html>
